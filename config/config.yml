logger:
  api_register: false
  request_stack_error: true

  request:
    enabled: true
    type: blacklist # blacklist or whitelist
    blacklist:
    - "/account/find_previous_or_empty"
    whitelist:
    - ""
    log_non_ok: false

server:
  host: "0.0.0.0"
  type: "http"
  http:
    port: 25565
  https:
    port: 25566
    cert: "./data/ssl/fullchain.pem"
    key: "./data/ssl/privkey.key"

database:
  type: "sqlite"
  sqlite:
    path: "./data/db/sky.db"
  mysql:
    host: "127.0.0.1"
    port: 3306
    user: "root"
    password: ""
    name: "xysky"
    connectionLimit: 10
    queueLimit: 0
    idleTimeout: 60000
    maxIdle: 5
    connectTimeout: 10000
    ssl: false
  postgres:
    host: "127.0.0.1"
    port: 5432
    user: "postgres"
    password: ""
    name: "xysky"
    max: 10
    idleTimeout: 30000
    connectTimeout: 10000
    ssl: false
  migrations:
    runOnStartup: true

jwt:
  secret: "1234cfe08b8e9a522229e4663e4c1234"
  expiresIn: "7d"

game:
  initialCurrency:
    candles: 5
    hearts: 5
    season_candle: 5
    prestige: 5

  # Daily quest / completion reset boundary (IANA time zone).
  # Live upstream resets at 00:00 Pacific time; this deployment defaults to
  # Asia/Shanghai. Change this single value to move the reset boundary.
  dailyResetTimeZone: "Asia/Shanghai"

  # In-game support entry (/account/support/get). The client displays the
  # returned URL as a QR code / opens it as a support session.
  # `url` may contain {user_id} and {language}; leave empty to use the official
  # https://sky.support.thatgame.co/<language>/player_insights/<user_id> form.
  support:
    url: "https://qm.qq.com/cgi-bin/qm/qr?k=273576833"
    channel: "Beta"
    defaultLanguage: "zh"

  socialFeed:
    socialFeedExpireDays: 30
    uri: "serveruri.cn"
    curatedFeeds:
      defaultFillPriority: [ "friends", "followed", "public", "local" ]
      friendsQueryLimit: 2000
      followedQueryLimit: 2000
      publicQueryLimit: 4000
      localQueryLimit: 4000
      maxBucketCount: 200
      allowCrossRingFill: true
      allowCrossBucketFill: true
      defaultInnerRadius: 16
      defaultOuterRadius: 0
      defaultVerticalRadius: 24
      scoreAlgoVersion: "v1a32"
      totalAvailableResultsMode: "filtered_unique"
      liteFields:
      - "social_feed_id"
      - "user_id"
      - "author_id"
      - "pool_type"
      - "pool_name"
      - "level_id"
      - "create_at"
      - "expire_at"
      - "message"
      - "content_type"
      - "content"
      - "resource_id"
      - "recording_id"
      - "tags"
      - "reactions"
      - "state"
      - "comments_enabled"
      - "location"
      - "local_creation"
      - "followed"
      - "friend"

udp:
  # Static "host:port" or an allocator URL ending in /allocate.
  uri: "100.64.15.8:19132"
  # Sent to clients when the allocator has no room capacity or is unreachable.
  # Point this at a real game node; 127.0.0.1:201 only makes sense for a
  # single-machine deployment.
  fallback: "127.0.0.1:201"

# per-player token and hands host/prefix/token to the client.
# Empty apiUrl = resource sync disabled (client issues no CDN requests); a
# request failure degrades to the same state instead of failing login.
cdn:
  # 为空 = 关闭资源同步（不发取码请求）。
  host: ""
  # Sent to the client as X-CDN-Prefix (usually empty).
  prefix: ""
  # Must match cdn.apiKey in cdnapi/config/config.yml.
  apiKey: ""
  timeoutMs: 3000

mqtt:
  brokerUrl: ""
  username: ""
  password: ""
cache: {}

contentModeration:
  enabled: false
  # Standalone moderation service (see moderation-api/README.md).
  apiUrl: "http://127.0.0.1:8787"
  # Optional bearer token; must match auth.token in moderation-api/config/config.yml.
  apiToken: ""
  timeoutMs: 3000
  # allow: chat keeps working if the API is down; block: fail closed.
  onError: "allow"
  cacheTtlSeconds: 60
  logViolations: true
