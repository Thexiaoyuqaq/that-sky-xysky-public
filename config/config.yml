- "gift_messages"
- "set_app_badge_number"
- "get_consumable_defs"
- "get_consumables"
- "get_buff_defs"
- "get_buffs"
- "get_lootboxes"
- "checkpoints"
- "generic_shop_defs"
- "external_account_friends"
- "serendipity_matches"
