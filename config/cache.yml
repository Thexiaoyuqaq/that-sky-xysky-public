cache:
  type: "memory"
  namespace: "xysky"
  defaultTTL: 0

  namespaces:
    session: "session"
    users: "users"
    currency: "currency"
    forgeRates: "forge-rates"
    contentModeration: "content-moderation"
    translation: "translation-cache"
    room: "room"

  list:
    session:
      ttl: 24000
      max_entries: 30000
    contentModeration:
      ttl: 300
    translation:
      ttl: 86400
    user:
      ttl: 30
    currency:
      ttl: 2
    forgeRates:
      minTTL: 60
      resetGraceTTL: 300
    # Room membership mirror behind chat scoping. wsManager rebuilds this index
    # from the allocator so a chat message only reaches players in the same room.
    room:
      # How often every online player's room is re-read from the allocator.
      # Real-time matters here (it decides who receives a message), so this is
      # kept at 1s. 0 disables the cycle: the sender is then resolved on demand
      # when they send, which costs one lookup on first message.
      refreshMs: 1000
      # Players per batch lookup request. Larger = fewer round trips, bigger
      # responses. The allocator caps a batch at 1000.
      batchSize: 500
      # Retention of the durable copy in the shared backend (redis / memory).
      # This is not the freshness window: the in-process index is rebuilt every
      # refreshMs. It only bounds how long an entry survives a restart.
      ttl: 30

  memory:
    maxEntries: 30000
    sweepIntervalMs: 30000

  redis:
    mode: "standalone"
    host: "127.0.0.1"
    port: 6379
    db: 0
    username: ""
    password: ""
    lazyConnect: true
    enableOfflineQueue: true
    enableAutoPipelining: true
    maxRetriesPerRequest: 1
    connectTimeout: 5000
    keepAlive: 30000
